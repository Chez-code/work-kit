set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
# work-kit: prefix + W opens the gate watcher pane to the right of the current
# pane, in that pane's directory (run it from the repo you launched claude in).
# `read -r` keeps the pane open if the script exits so its message is readable.
bind W split-window -h -l 40% -c "#{pane_current_path}" 'python3 .claude/bin/gate-watch.py; read -r'
# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
